<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиальная Панель Управления</title>
    <!-- Подключаем Tailwind CSS для быстрой и красивой стилизации -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем шрифт Inter и иконки Lucide -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        darkBg: '#090a0f',
                        cardBg: '#13151f',
                        cardBorder: '#1e2235',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090a0f;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(19, 21, 31, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

    <!-- Шапка панели -->
    <header class="w-full max-w-4xl mb-8 flex items-center justify-between glass-panel px-6 py-4 rounded-2xl shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-white">Admin Control Center</h1>
                <p class="text-xs text-gray-400">Премиальное управление системой</p>
            </div>
        </div>
        <button onclick="logout()" class="flex items-center space-x-2 text-sm text-gray-400 hover:text-red-400 transition bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-4 py-2 rounded-xl">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Выйти</span>
        </button>
    </header>

    <!-- Основной контейнер -->
    <main class="w-full max-w-4xl space-y-6">

        <!-- Главное меню кнопок -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- 1. Кнопка "Пароли" с раскрывающимся подменю -->
            <div class="glass-panel p-6 rounded-2xl transition duration-300 border border-indigo-500/20 hover:border-indigo-500/40">
                <div class="flex items-center justify-between cursor-pointer" onclick="toggleSubMenu('passwordsSubMenu')">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                            <i data-lucide="key-round" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-semibold text-white">Пароли</h2>
                            <p class="text-xs text-gray-400">Управление доступом, генерация и копирование</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-down" id="passwordsChevron" class="w-5 h-5 text-gray-400 transition-transform duration-300"></i>
                </div>

                <!-- Подменю паролей (3 кнопки) -->
                <div id="passwordsSubMenu" class="hidden mt-5 pt-4 border-t border-white/5 grid grid-cols-1 gap-2.5">
                    <button onclick="openPasswordsSection('site')" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-indigo-600/20 border border-white/5 hover:border-indigo-500/30 text-sm font-medium text-gray-200 transition flex items-center justify-between">
                        <span class="flex items-center space-x-3"><i data-lucide="globe" class="w-4 h-4 text-indigo-400"></i><span>Сайт</span></span>
                        <i data-lucide="arrow-right" class="w-4 h-4 text-gray-500"></i>
                    </button>
                    <button onclick="openPasswordsSection('admin')" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-indigo-600/20 border border-white/5 hover:border-indigo-500/30 text-sm font-medium text-gray-200 transition flex items-center justify-between">
                        <span class="flex items-center space-x-3"><i data-lucide="lock" class="w-4 h-4 text-indigo-400"></i><span>Админ-панель</span></span>
                        <i data-lucide="arrow-right" class="w-4 h-4 text-gray-500"></i>
                    </button>
                    <button onclick="openPasswordsSection('apps')" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-indigo-600/20 border border-white/5 hover:border-indigo-500/30 text-sm font-medium text-gray-200 transition flex items-center justify-between">
                        <span class="flex items-center space-x-3"><i data-lucide="grid" class="w-4 h-4 text-indigo-400"></i><span>Пароли приложений (Список)</span></span>
                        <i data-lucide="arrow-right" class="w-4 h-4 text-gray-500"></i>
                    </button>
                </div>
            </div>

            <!-- 2. Кнопка "Видимость приложений" -->
            <div onclick="openVisibilitySection()" class="glass-panel p-6 rounded-2xl cursor-pointer transition duration-300 border border-white/5 hover:border-indigo-500/40 group">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-600/10 border border-purple-500/20 flex items-center justify-center text-purple-400 group-hover:scale-110 transition">
                        <i data-lucide="eye" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-semibold text-white">Видимость приложений</h2>
                        <p class="text-xs text-gray-400">Настройка отображения элементов каталога</p>
                    </div>
                </div>
            </div>

            <!-- 3. Кнопка "Режим обслуживания" -->
            <div onclick="openMaintenanceSection()" class="glass-panel p-6 rounded-2xl cursor-pointer transition duration-300 border border-white/5 hover:border-amber-500/40 group">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-amber-600/10 border border-amber-500/20 flex items-center justify-center text-amber-400 group-hover:scale-110 transition">
                        <i data-lucide="wrench" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-semibold text-white">Режим обслуживания</h2>
                        <p class="text-xs text-gray-400">Включение заглушки и технических работ</p>
                    </div>
                </div>
            </div>

            <!-- 4. Кнопка "История действий" -->
            <div onclick="openHistorySection()" class="glass-panel p-6 rounded-2xl cursor-pointer transition duration-300 border border-white/5 hover:border-emerald-500/40 group">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-600/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition">
                        <i data-lucide="history" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-semibold text-white">История действий</h2>
                        <p class="text-xs text-gray-400">Логирование и аудит админ-панели</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Динамическая рабочая зона / Модальный блок функционала паролей и т.д. -->
        <div id="workspace" class="glass-panel p-6 rounded-2xl hidden">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/5">
                <h3 id="workspaceTitle" class="text-lg font-semibold text-white">Раздел</h3>
                <button onclick="closeWorkspace()" class="text-gray-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="workspaceContent" class="space-y-4">
                <!-- Сюда динамически подгружается функционал генерации, сохранения, копирования и списков -->
            </div>
        </div>

    </main>

    <!-- Инициализация икон и логика скриптов -->
    <script>
        lucide.createIcons();

        function toggleSubMenu(id) {
            const menu = document.getElementById(id);
            const chevron = document.getElementById('passwordsChevron');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                menu.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function showWorkspace(title, htmlContent) {
            const ws = document.getElementById('workspace');
            const wsTitle = document.getElementById('workspaceTitle');
            const wsContent = document.getElementById('workspaceContent');
            
            wsTitle.textContent = title;
            wsContent.innerHTML = htmlContent;
            ws.classList.remove('hidden');
            ws.scrollIntoView({ behavior: 'smooth' });
            lucide.createIcons();
        }

        function closeWorkspace() {
            document.getElementById('workspace').classList.add('hidden');
        }

        function openPasswordsSection(type) {
            let title = '';
            if (type === 'site') title = 'Пароль: Сайт';
            if (type === 'admin') title = 'Пароль: Админ-панель';
            if (type === 'apps') title = 'Пароли приложений (Весь список)';

            let content = `
                <div class="space-y-4">
                    <p class="text-sm text-gray-400">Управление защитой для раздела: <strong>${title}</strong></p>
                    <div class="flex space-x-2">
                        <input type="text" id="passInput" value="sec_key_99281_xyz" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <button onclick="generatePassword()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition glow-btn flex items-center space-x-1">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                            <span>Генерация</span>
                        </button>
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="copyPassword()" class="flex-1 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl text-sm font-medium transition flex items-center justify-center space-x-2">
                            <i data-lucide="copy" class="w-4 h-4 text-indigo-400"></i>
                            <span>Копировать</span>
                        </button>
                        <button onclick="savePassword()" class="flex-1 py-2.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 rounded-xl text-sm font-medium transition flex items-center justify-center space-x-2">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            <span>Сохранить</span>
                        </button>
                    </div>
                </div>
            `;
            showWorkspace(title, content);
        }

        function openVisibilitySection() {
            showWorkspace('Видимость приложений', `
                <div class="space-y-3">
                    <p class="text-sm text-gray-400">Управляйте доступностью приложений в общем каталоге:</p>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-sm font-medium text-white">SberBank iOS</span>
                            <input type="checkbox" checked class="w-4 h-4 accent-indigo-600 cursor-pointer">
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-sm font-medium text-white">T-Bank iOS</span>
                            <input type="checkbox" checked class="w-4 h-4 accent-indigo-600 cursor-pointer">
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-sm font-medium text-white">Max App</span>
                            <input type="checkbox" class="w-4 h-4 accent-indigo-600 cursor-pointer">
                        </div>
                    </div>
                </div>
            `);
        }

        function openMaintenanceSection() {
            showWorkspace('Режим обслуживания', `
                <div class="space-y-4">
                    <p class="text-sm text-gray-400">Включение технического режима блокирует клиентскую часть сайта красивой заглушкой.</p>
                    <div class="flex items-center justify-between p-4 rounded-xl bg-amber-500/10 border border-amber-500/20">
                        <div>
                            <h4 class="text-sm font-semibold text-amber-200">Статус обслуживания</h4>
                            <p class="text-xs text-amber-300/70">Сайт сейчас работает в штатном режиме</p>
                        </div>
                        <button onclick="alert('Режим обслуживания изменен!')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-semibold transition">
                            Включить режим
                        </button>
                    </div>
                </div>
            `);
        }

        function openHistorySection() {
            showWorkspace('История действий', `
                <div class="space-y-3 text-sm">
                    <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex justify-between items-center">
                        <span class="text-gray-300">Изменен пароль администратора</span>
                        <span class="text-xs text-gray-500">Сегодня, 18:42</span>
                    </div>
                    <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex justify-between items-center">
                        <span class="text-gray-300">Обновлена видимость приложений</span>
                        <span class="text-xs text-gray-500">Сегодня, 15:10</span>
                    </div>
                </div>
            `);
        }

        function generatePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passInput').value = pass;
        }

        function copyPassword() {
            const input = document.getElementById('passInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("Пароль скопирован в буфер обмена!");
        }

        function savePassword() {
            alert("Пароль успешно сохранен в базе данных!");
        }

        function logout() {
            if(confirm("Вы действительно хотите выйти?")) {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
