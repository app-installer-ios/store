<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Панель управления — Управление приложениями</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --input-bg: #1f2937;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 24px;
        }

        /* Экран авторизации */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 380px;
            margin: 20px auto;
        }

        .login-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        /* Основная панель */
        #admin-panel {
            display: none;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Кнопка открытия каталога паролей приложений */
        .custom-select-btn {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none;
        }
        .custom-select-btn:hover {
            border-color: var(--accent-color);
            background: rgba(139, 92, 246, 0.05);
            transform: none;
        }

        #status-message, #login-error {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .error { color: var(--danger-color); }
        .success { color: var(--success-color); }

        /* Модальное окно каталога (как на основном сайте) */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: rgba(2, 4, 9, 0.7);
            backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sheet-modal {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: min(80vh, 560px);
            display: flex;
            flex-direction: column;
            padding: 18px 16px;
            border-radius: 24px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            transform: translateY(20px) scale(.97);
            transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .3s ease;
            opacity: 0;
        }
        .sheet-overlay.active .sheet-modal {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-title {
            font-size: 17px;
            font-weight: 650;
            color: #fff;
        }
        .sheet-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: none;
            font-size: 14px;
            padding: 0;
        }
        .sheet-close:hover { background: rgba(139, 92, 246, 0.3); transform: none; }

        /* Поиск в каталоге */
        .app-search-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .app-search {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 38px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .app-search:focus { border-color: var(--accent-color); }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Список приложений в каталоге */
        .sheet-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }
        .sheet-item {
            min-height: 48px;
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sheet-item:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.4);
        }
        .sheet-item span.app-name {
            color: #f1f5f9;
            font-size: 14px;
            font-weight: 500;
        }
        .app-pass-badge {
            font-size: 12px;
            color: var(--accent-color);
            background: rgba(139, 92, 246, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
        }

        /* Модальное окно редактирования пароля конкретного приложения */
        .edit-modal {
            max-width: 360px;
            height: auto;
            padding: 24px;
        }
        .edit-app-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Секция входа в админку -->
    <div id="login-screen">
        <h1>Вход в админку</h1>
        <p class="subtitle">Введите пароль администратора</p>
        <div class="login-box">
            <div class="input-group" style="text-align: left;">
                <label for="admin-pass-input">Пароль</label>
                <input type="password" id="admin-pass-input" placeholder="••••••••••••">
            </div>
            <button onclick="checkAdminAuth()">Войти</button>
        </div>
        <div id="login-error" class="error"></div>
    </div>

    <!-- Основной интерфейс управления -->
    <div id="admin-panel">
        <h1>Панель управления</h1>
        <p class="subtitle">Настройка общих параметров и кодов доступа к приложениям</p>

        <div class="section-title">1. Пароль администратора</div>
        <div class="input-group">
            <input type="text" id="key-admin_password" placeholder="Пароль админки">
        </div>

        <div class="section-title">2. Общий пароль сайта</div>
        <div class="input-group">
            <input type="text" id="key-site_password" placeholder="Пароль сайта">
        </div>

        <div class="section-title">3. Пароли приложений</div>
        <div class="input-group">
            <label>Каталог приложений (нажмите, чтобы просмотреть и изменить пароли)</label>
            <button type="button" class="custom-select-btn" onclick="openAppsCatalogSheet()">
                <span id="catalogButtonText" style="color: var(--text-muted);">Выбрать приложение для смены пароля...</span>
                <span style="color: var(--accent-color); font-size: 18px;">›</span>
            </button>
        </div>

        <button class="btn-save" style="margin-top: 28px; width: 100%;" onclick="saveSettings()">Сохранить все изменения</button>
        <div id="status-message"></div>
    </div>
</div>

<!-- Модальное окно каталога приложений -->
<div class="sheet-overlay" id="appsCatalogOverlay" onclick="closeAppsCatalogSheet()">
    <div class="sheet-modal" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <div class="sheet-title">Каталог приложений</div>
            <button type="button" class="sheet-close" onclick="closeAppsCatalogSheet()">✕</button>
        </div>
        <div class="app-search-wrap">
            <span class="search-icon">⌕</span>
            <input type="search" id="adminAppSearch" class="app-search" placeholder="Поиск по названию..." oninput="filterAdminApps()" autocomplete="off">
        </div>
        <div class="sheet-list" id="adminAppsList">
            <!-- Сюда динамически подгружаются приложения в том же порядке -->
        </div>
    </div>
</div>

<!-- Модальное окно редактирования пароля выбранного приложения -->
<div class="sheet-overlay" id="editAppOverlay" onclick="closeEditAppModal()">
    <div class="sheet-modal edit-modal" onclick="event.stopPropagation()">
        <div class="edit-app-title" id="editModalAppTitle">Приложение</div>
        <div class="input-group" style="margin-bottom: 16px;">
            <label>Пароль доступа</label>
            <input type="text" id="editAppPasswordInput" placeholder="Введите новый пароль">
        </div>
        <div style="display: flex; gap: 10px;">
            <button type="button" style="background: var(--input-bg); border: 1px solid var(--border-color); flex: 1;" onclick="closeEditAppModal()">Отмена</button>
            <button type="button" style="flex: 1;" onclick="saveAppPasswordFromModal()">Сохранить</button>
        </div>
    </div>
</div>

<script>
    // НАСТРОЙКИ SUPABASE
    const SUPABASE_URL = 'https://gbuvpqcummyutycemaaj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oUDovfvWL6iioG6N5Xd_QQ_8KYezq8g';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Полный упорядоченный список приложений (как на главном сайте)
    const appConfigList = [
        { key: "vk", name: "ВКонтакте" },
        { key: "max", name: "MAX" },
        { key: "vk-video", name: "VK Видео" },
        { key: "vk-clips", name: "VK Клипы" },
        { key: "sberfinansy", name: "СберБанк (Финансы Онлайн)" },
        { key: "avito", name: "Авито" },
        { key: "sovkombank-vsekarty", name: "Совкомбанк (Все карты MDS)" },
        { key: "tbank", name: "Т-Банк (8PRO)" },
        { key: "sovkombank-sinoptik", name: "Совкомбанк (Синоптик+)" },
        { key: "drive-transit", name: "Т-Банк (Drive Transit)" },
        { key: "lenta", name: "Лента" },
        { key: "yandex-pay", name: "Яндекс Пэй" },
        { key: "2gis", name: "2ГИС" },
        { key: "psb", name: "ПСБ (Чайная Церемония)" },
        { key: "kuper", name: "Купер" },
        { key: "rutube", name: "Rutube(Starship Battle)" },
        { key: "mobio", name: "СберМобайл (Мобио)" },
        { key: "rzd", name: "РЖД Пассажирам" },
        { key: "sberkids", name: "СберKids (SpeakaBoo)" },
        { key: "lentaa", name: "Лента (Быстро Продукты)" },
        { key: "avito-anero", name: "Авито (Anero)" },
        { key: "craftersy", name: "Т-Банк (Craftersy)" },
        { key: "scbnotes", name: "СовкомБанк (SCB Notes)" },
        { key: "ak-bars-bank", name: "АК Барс (Всё Учтено)" },
        { key: "blum", name: "РокетБанк (Блум)" }
    ];

    // Локальное хранилище текущих значений паролей в памяти админки
    let appPasswordsData = {};
    let currentEditingKey = null;

    async function checkAdminAuth() {
        const inputPass = document.getElementById('admin-pass-input').value;
        const errorDiv = document.getElementById('login-error');
        errorDiv.textContent = 'Проверка...';
        errorDiv.className = '';

        try {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'admin_password')
                .single();

            if (error || !data) {
                errorDiv.textContent = 'Ошибка подключения к базе данных.';
                errorDiv.className = 'error';
                return;
            }

            if (inputPass === data.value) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadSettings();
            } else {
                errorDiv.textContent = 'Неверный пароль!';
                errorDiv.className = 'error';
            }
        } catch (err) {
            errorDiv.textContent = 'Произошла ошибка авторизации.';
            errorDiv.className = 'error';
            console.error(err);
        }
    }

    async function loadSettings() {
        const { data, error } = await supabaseClient
            .from('settings')
            .select('key, value');

        if (error) {
            console.error('Ошибка загрузки настроек:', error);
            return;
        }

        data.forEach(item => {
            if (item.key === 'admin_password' || item.key === 'site_password') {
                const input = document.getElementById(`key-${item.key}`);
                if (input) input.value = item.value;
            } else {
                appPasswordsData[item.key] = item.value;
            }
        });

        renderAdminAppsList();
    }

    function renderAdminAppsList() {
        const listContainer = document.getElementById('adminAppsList');
        listContainer.innerHTML = '';

        appConfigList.forEach(app => {
            const currentPass = appPasswordsData[app.key] || '';
            const div = document.createElement('div');
            div.className = 'sheet-item';
            div.setAttribute('data-name', app.name.toLowerCase());
            div.onclick = () => openEditAppModal(app.key, app.name);
            div.innerHTML = `
                <span class="app-name">${app.name}</span>
                <span class="app-pass-badge">${currentPass ? currentPass : 'нет пароля'}</span>
            `;
            listContainer.appendChild(div);
        });
    }

    function filterAdminApps() {
        const query = document.getElementById('adminAppSearch').value.toLowerCase();
        document.querySelectorAll('#adminAppsList .sheet-item').forEach(item => {
            const name = item.getAttribute('data-name');
            if (name.includes(query)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function openAppsCatalogSheet() {
        document.getElementById('appsCatalogOverlay').classList.add('active');
        document.getElementById('adminAppSearch').value = '';
        filterAdminApps();
    }

    function closeAppsCatalogSheet() {
        document.getElementById('appsCatalogOverlay').classList.remove('active');
    }

    function openEditAppModal(key, name) {
        currentEditingKey = key;
        document.getElementById('editModalAppTitle').textContent = name;
        document.getElementById('editAppPasswordInput').value = appPasswordsData[key] || '';
        closeAppsCatalogSheet();
        document.getElementById('editAppOverlay').classList.add('active');
        document.getElementById('editAppPasswordInput').focus();
    }

    function closeEditAppModal() {
        document.getElementById('editAppOverlay').classList.remove('active');
        currentEditingKey = null;
    }

    async function saveAppPasswordFromModal() {
        if (!currentEditingKey) return;
        const newPass = document.getElementById('editAppPasswordInput').value.trim();
        appPasswordsData[currentEditingKey] = newPass;

        // Сразу сохраняем конкретное приложение в Supabase
        const { error } = await supabaseClient
            .from('settings')
            .upsert({ key: currentEditingKey, value: newPass }, { onConflict: 'key' });

        if (error) {
            alert('Ошибка при сохранении пароля приложения в базу.');
            console.error(error);
        } else {
            renderAdminAppsList();
            closeEditAppModal();
            // Обновляем текст на кнопке каталога
            document.getElementById('catalogButtonText').textContent = 'Каталог приложений настроен (' + Object.keys(appPasswordsData).length + ' апп.)';
            document.getElementById('catalogButtonText').style.color = '#fff';
        }
    }

    async function saveSettings() {
        const statusMsg = document.getElementById('status-message');
        statusMsg.textContent = 'Сохранение общих настроек...';
        statusMsg.className = '';

        const adminPass = document.getElementById('key-admin_password').value;
        const sitePass = document.getElementById('key-site_password').value;

        let hasError = false;

        // Сохраняем админку и сайт
        const keysToSave = [
            { key: 'admin_password', value: adminPass },
            { key: 'site_password', value: sitePass }
        ];

        for (const item of keysToSave) {
            const { error } = await supabaseClient
                .from('settings')
                .upsert({ key: item.key, value: item.value }, { onConflict: 'key' });
            if (error) hasError = true;
        }

        if (hasError) {
            statusMsg.textContent = 'Ошибка при сохранении общих параметров.';
            statusMsg.className = 'error';
        } else {
            statusMsg.textContent = 'Все изменения успешно сохранены!';
            statusMsg.className = 'success';
        }
    }
</script>

</body>
</html>
