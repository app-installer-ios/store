<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — Управление паролями</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --input-bg: #1f2937;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Экран авторизации */
        #login-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 50px auto;
        }

        /* Основная панель */
        #admin-panel {
            display: none;
        }

        .section-title {
            font-size: 18px;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .btn-save {
            margin-top: 30px;
            width: 100%;
        }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .error { color: var(--danger-color); }
        .success { color: var(--accent-color); }
    </style>
</head>
<body>

<div class="container">
    <!-- Секция входа по паролю администратора -->
    <div id="login-screen">
        <h1>Вход в админку</h1>
        <p class="subtitle">Введите пароль администратора для управления</p>
        <div class="input-group">
            <label for="admin-pass-input">Пароль администратора</label>
            <input type="password" id="admin-pass-input" placeholder="Введите admin_password">
        </div>
        <button onclick="checkAdminAuth()">Войти</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- Основной интерфейс управления -->
    <div id="admin-panel">
        <h1>Панель управления</h1>
        <p class="subtitle">Изменение паролей и кодов доступа к приложениям</p>

        <div class="section-title">Основные настройки</div>
        <div class="grid">
            <div class="input-group">
                <label>admin_password</label>
                <input type="text" id="key-admin_password">
            </div>
            <div class="input-group">
                <label>site_password</label>
                <input type="text" id="key-site_password">
            </div>
        </div>

        <div class="section-title">Приложения и сервисы</div>
        <div class="grid" id="apps-grid">
            <!-- Сюда динамически подгрудятся все остальные ключи из базы -->
        </div>

        <button class="btn-save" onclick="saveSettings()">Сохранить изменения</button>
        <div id="status-message"></div>
    </div>
</div>

<script>
    // ЗАМЕНИТЕ НА СВОИ ДАННЫЕ SUPABASE
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'ВАШ_SUPABASE_ANON_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Список известных ключей приложений из ваших скриншотов
    const knownKeys = [
        "2gis", "akbars_vseychteno", "avito", "avito_anero", "kuper", 
        "lenta", "lenta_bistroprodykti", "max", "psb_chainay", "rocketbank", 
        "rutube_starship", "rzd", "sberbank", "sberkids_speakaboo", "sbermobail_mobio", 
        "sovkom_scbnotes", "sovkom_sinoptik", "sovkom_vsekarty", "tbank_8pro", 
        "tbank_craftersy", "tbank_drive", "vk", "vk_klips", "vk_video", "yandex_pay"
    ];

    async function checkAdminAuth() {
        const inputPass = document.getElementById('admin-pass-input').value;
        const errorDiv = document.getElementById('login-error');
        errorDiv.textContent = 'Проверка...';

        try {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'admin_password')
                .single();

            if (error || !data) {
                errorDiv.textContent = 'Ошибка подключения к базе данных.';
                return;
            }

            if (inputPass === data.value) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadSettings();
            } else {
                errorDiv.textContent = 'Неверный пароль администратора!';
            }
        } catch (err) {
            errorDiv.textContent = 'Произошла ошибка авторизации.';
            console.error(err);
        }
    }

    async function loadSettings() {
        const appsGrid = document.getElementById('apps-grid');
        appsGrid.innerHTML = '';

        // Генерируем инпуты для всех приложений
        knownKeys.forEach(key => {
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <label>${key}</label>
                <input type="text" id="key-${key}">
            `;
            appsGrid.appendChild(div);
        });

        // Загружаем данные из таблицы settings
        const { data, error } = await supabaseClient
            .from('settings')
            .select('key, value');

        if (error) {
            console.error('Ошибка загрузки настроек:', error);
            return;
        }

        // Заполняем поля значениями из базы
        data.forEach(item => {
            const input = document.getElementById(`key-${item.key}`);
            if (input) {
                input.value = item.value;
            }
        });
    }

    async function saveSettings() {
        const statusMsg = document.getElementById('status-message');
        statusMsg.textContent = 'Сохранение...';
        statusMsg.className = '';

        const allKeysToSave = ['admin_password', 'site_password', ...knownKeys];
        let hasError = false;

        for (const key of allKeysToSave) {
            const input = document.getElementById(`key-${key}`);
            if (input) {
                const value = input.value;
                // Обновляем или добавляем запись в таблицу settings
                const { error } = await supabaseClient
                    .from('settings')
                    .upsert({ key: key, value: value }, { onConflict: 'key' });

                if (error) {
                    console.error(`Ошибка при сохранении ${key}:`, error);
                    hasError = true;
                }
            }
        }

        if (hasError) {
            statusMsg.textContent = 'Часть данных не удалось сохранить. Проверьте консоль.';
            statusMsg.className = 'error';
        } else {
            statusMsg.textContent = 'Все изменения успешно сохранены в Supabase!';
            statusMsg.className = 'success';
        }
    }
</script>

</body>
</html>
