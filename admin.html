<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070910">
    <title>Панель управления — Управление приложениями</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #05060a;
            --glass: rgba(255,255,255,.075);
            --glass-light: rgba(255,255,255,.105);
            --border: rgba(255,255,255,.14);
            --text: #f8fafc;
            --muted: #9ca3af;
            --muted-light: #cbd5e1;
            --accent-color: #a970ff;
            --accent-hover: #9b8cff;
            --danger-color: #ff7777;
            --success-color: #43e3a5;
            --spring: cubic-bezier(.22,1,.36,1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100dvh;
            background:
                radial-gradient(circle at 18% 8%, rgba(130,70,255,.20), transparent 32%),
                radial-gradient(circle at 88% 18%, rgba(40,150,255,.16), transparent 30%),
                radial-gradient(circle at 75% 92%, rgba(40,210,160,.10), transparent 30%),
                #05060a;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .aurora-bg {
            position: fixed;
            inset: -15%;
            z-index: -10;
            background:
                radial-gradient(ellipse at 18% 18%, rgba(150,80,255,.24), transparent 35%),
                radial-gradient(ellipse at 85% 20%, rgba(50,150,255,.19), transparent 35%),
                linear-gradient(135deg, #06070d 0%, #0d1020 48%, #07100f 100%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: linear-gradient(145deg, rgba(255,255,255,.115), rgba(255,255,255,.045));
            backdrop-filter: blur(40px) saturate(170%);
            -webkit-backdrop-filter: blur(40px) saturate(170%);
            border: 1px solid rgba(255,255,255,.145);
            border-radius: 30px;
            padding: 30px 22px;
            box-shadow: 0 35px 90px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.14);
            animation: screenIn .45s var(--spring);
        }

        @keyframes screenIn {
            from { opacity: 0; transform: translateY(14px) scale(.975); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 10%, #e1c7ff 55%, #9b8cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Экран авторизации */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .login-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        /* Основная панель */
        #admin-panel {
            display: none;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--muted-light);
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,.18);
            border: 1px solid rgba(255,255,255,.105);
            border-radius: 16px;
            padding: 0 15px;
            color: #fff;
            font-size: 15px;
            text-align: center;
            outline: none;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: rgba(178,130,255,.52);
            background: rgba(255,255,255,.065);
            box-shadow: 0 0 0 3px rgba(168,85,247,.08), 0 0 30px rgba(168,85,247,.13);
        }

        button {
            width: 100%;
            min-height: 50px;
            background: linear-gradient(135deg, rgba(168,85,247,.93), rgba(99,102,241,.94));
            color: white;
            border: 1.5px solid rgba(217, 70, 239, 0.75);
            border-radius: 16px;
            padding: 12px;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(109,68,220,.28), 0 0 20px rgba(168, 85, 247, 0.3);
            transition: all 0.2s var(--spring);
        }

        button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        /* Кнопка открытия каталога */
        .custom-select-btn {
            width: 100%;
            min-height: 50px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.105);
            background: rgba(255,255,255,.048);
            color: #fff;
            cursor: pointer;
            box-shadow: none;
        }
        .custom-select-btn:hover {
            border-color: rgba(174,130,255,.35);
            background: rgba(255,255,255,.07);
            transform: none;
        }

        #status-message, #login-error {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            min-height: 20px;
            font-weight: 600;
        }

        .error { color: var(--danger-color); }
        .success { color: var(--success-color); }

        /* Модальное окно каталога */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: rgba(2, 4, 9, 0.65);
            backdrop-filter: blur(30px) saturate(180%);
            opacity: 0;
            visibility: hidden;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sheet-modal {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: min(78vh, 580px);
            display: flex;
            flex-direction: column;
            padding: 18px 16px;
            border-radius: 26px;
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(15,20,35,0.75));
            border: 1.5px solid rgba(130, 140, 255, 0.45);
            box-shadow: 0 35px 90px rgba(0,0,0,0.65);
            transform: translateY(20px) scale(.97);
            transition: transform .4s var(--spring), opacity .3s ease;
            opacity: 0;
        }
        .sheet-overlay.active .sheet-modal {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .sheet-title {
            font-size: 17px;
            font-weight: 650;
            background: linear-gradient(135deg, #ffffff 10%, #e1c7ff 55%, #9b8cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sheet-close {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.065);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
        }
        .sheet-close:hover { background: rgba(168, 85, 247, 0.2); transform: none; }

        /* Поиск в каталоге */
        .app-search-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .app-search {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 38px;
            border-radius: 14px;
            border: 1.5px solid rgba(168, 85, 247, 0.85);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 13.5px;
            outline: none;
        }
        .app-search:focus { border-color: rgba(168, 85, 247, 0.95); }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #d946ef;
            font-size: 15px;
        }

        /* Список приложений в каталоге */
        .sheet-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }
        .sheet-item {
            min-height: 46px;
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.05), rgba(88, 184, 255, 0.06));
            border: 1.5px solid rgba(34, 211, 238, 0.45);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sheet-item:hover {
            background: rgba(34, 211, 238, 0.12);
            border-color: rgba(34, 211, 238, 0.75);
        }
        .sheet-item span.app-name {
            color: #f1f5f9;
            font-size: 13.5px;
            font-weight: 550;
        }
        .app-pass-badge {
            font-size: 12px;
            color: #e1c7ff;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.45);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
        }

        /* Модальное окно редактирования пароля приложения */
        .edit-modal {
            max-width: 360px;
            height: auto;
            padding: 24px;
        }
        .edit-app-title {
            font-size: 17px;
            font-weight: 650;
            color: #fff;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="aurora-bg"></div>

<div class="container">
    <!-- Секция входа в админку -->
    <div id="login-screen">
        <h1>Вход в админку</h1>
        <p class="subtitle">Введите цифровой пароль администратора</p>
        <div class="login-box">
            <div class="input-group" style="text-align: left;">
                <label for="admin-pass-input">Пароль</label>
                <!-- Только цифровой ввод, без точек до начала ввода -->
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="admin-pass-input" placeholder="Введите цифры" autocomplete="off">
            </div>
            <button onclick="checkAdminAuth()">Войти</button>
        </div>
        <div id="login-error" class="error"></div>
    </div>

    <!-- Основной интерфейс управления -->
    <div id="admin-panel">
        <h1>Панель управления</h1>
        <p class="subtitle">Настройка общих параметров и кодов доступа</p>

        <div class="section-title">1. Пароль администратора</div>
        <div class="input-group">
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="key-admin_password" placeholder="Цифровой пароль админки">
        </div>

        <div class="section-title">2. Общий пароль сайта</div>
        <div class="input-group">
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="key-site_password" placeholder="Цифровой пароль сайта">
        </div>

        <div class="section-title">3. Пароли приложений</div>
        <div class="input-group">
            <label>Каталог приложений</label>
            <button type="button" class="custom-select-btn" onclick="openAppsCatalogSheet()">
                <span id="catalogButtonText" style="color: var(--muted);">Выбрать приложение...</span>
                <span style="color: var(--accent-color); font-size: 18px;">›</span>
            </button>
        </div>

        <button style="margin-top: 24px; width: 100%;" onclick="saveSettings()">Сохранить все изменения</button>
        <div id="status-message"></div>
    </div>
</div>

<!-- Модальное окно каталога приложений -->
<div class="sheet-overlay" id="appsCatalogOverlay" onclick="closeAppsCatalogSheet()">
    <div class="sheet-modal" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <div class="sheet-title">Каталог приложений</div>
            <button type="button" class="sheet-close" onclick="closeAppsCatalogSheet()">✕</button>
        </div>
        <div class="app-search-wrap">
            <span class="search-icon">⌕</span>
            <input type="search" id="adminAppSearch" class="app-search" placeholder="Поиск по названию..." oninput="filterAdminApps()" autocomplete="off">
        </div>
        <div class="sheet-list" id="adminAppsList"></div>
    </div>
</div>

<!-- Модальное окно редактирования пароля выбранного приложения -->
<div class="sheet-overlay" id="editAppOverlay" onclick="closeEditAppModal()">
    <div class="sheet-modal edit-modal" onclick="event.stopPropagation()">
        <div class="edit-app-title" id="editModalAppTitle">Приложение</div>
        <div class="input-group" style="margin-bottom: 16px;">
            <label>Пароль доступа (только цифры)</label>
            <!-- Только цифры для пароля приложения -->
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="editAppPasswordInput" placeholder="Введите новый пароль" autocomplete="off">
        </div>
        <div style="display: flex; gap: 10px;">
            <button type="button" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); flex: 1;" onclick="closeEditAppModal()">Отмена</button>
            <button type="button" style="flex: 1;" onclick="saveAppPasswordFromModal()">Сохранить</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gbuvpqcummyutycemaaj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oUDovfvWL6iioG6N5Xd_QQ_8KYezq8g';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const appConfigList = [
        { key: "vk", name: "ВКонтакте" },
        { key: "max", name: "MAX" },
        { key: "vk-video", name: "VK Видео" },
        { key: "vk-clips", name: "VK Клипы" },
        { key: "sberfinansy", name: "СберБанк (Финансы Онлайн)" },
        { key: "avito", name: "Авито" },
        { key: "sovkombank-vsekarty", name: "Совкомбанк (Все карты MDS)" },
        { key: "tbank", name: "Т-Банк (8PRO)" },
        { key: "sovkombank-sinoptik", name: "Совкомбанк (Синоптик+)" },
        { key: "drive-transit", name: "Т-Банк (Drive Transit)" },
        { key: "lenta", name: "Лента" },
        { key: "yandex-pay", name: "Яндекс Пэй" },
        { key: "2gis", name: "2ГИС" },
        { key: "psb", name: "ПСБ (Чайная Церемония)" },
        { key: "kuper", name: "Купер" },
        { key: "rutube", name: "Rutube(Starship Battle)" },
        { key: "mobio", name: "СберМобайл (Мобио)" },
        { key: "rzd", name: "РЖД Пассажирам" },
        { key: "sberkids", name: "СберKids (SpeakaBoo)" },
        { key: "lentaa", name: "Лента (Быстро Продукты)" },
        { key: "avito-anero", name: "Авито (Anero)" },
        { key: "craftersy", name: "Т-Банк (Craftersy)" },
        { key: "scbnotes", name: "СовкомБанк (SCB Notes)" },
        { key: "ak-bars-bank", name: "АК Барс (Всё Учтено)" },
        { key: "blum", name: "РокетБанк (Блум)" }
    ];

    let appPasswordsData = {};
    let currentEditingKey = null;

    async function checkAdminAuth() {
        const inputPass = document.getElementById('admin-pass-input').value.trim();
        const errorDiv = document.getElementById('login-error');
        errorDiv.textContent = 'Проверка...';
        errorDiv.className = '';

        try {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'admin_password')
                .single();

            if (error || !data) {
                errorDiv.textContent = 'Ошибка подключения к базе данных.';
                errorDiv.className = 'error';
                return;
            }

            if (inputPass === data.value) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadSettings();
            } else {
                errorDiv.textContent = 'Неверный пароль!';
                errorDiv.className = 'error';
            }
        } catch (err) {
            errorDiv.textContent = 'Произошла ошибка авторизации.';
            errorDiv.className = 'error';
        }
    }

    async function loadSettings() {
        const { data, error } = await supabaseClient
            .from('settings')
            .select('key, value');

        if (error) return;

        data.forEach(item => {
            if (item.key === 'admin_password' || item.key === 'site_password') {
                const input = document.getElementById(`key-${item.key}`);
                if (input) input.value = item.value;
            } else {
                appPasswordsData[item.key] = item.value;
            }
        });

        renderAdminAppsList();
    }

    function renderAdminAppsList() {
        const listContainer = document.getElementById('adminAppsList');
        listContainer.innerHTML = '';

        appConfigList.forEach(app => {
            const currentPass = appPasswordsData[app.key] || '';
            const div = document.createElement('div');
            div.className = 'sheet-item';
            div.setAttribute('data-name', app.name.toLowerCase());
            div.onclick = () => openEditAppModal(app.key, app.name);
            div.innerHTML = `
                <span class="app-name">${app.name}</span>
                <span class="app-pass-badge">${currentPass ? currentPass : 'нет пароля'}</span>
            `;
            listContainer.appendChild(div);
        });
    }

    function filterAdminApps() {
        const query = document.getElementById('adminAppSearch').value.toLowerCase();
        document.querySelectorAll('#adminAppsList .sheet-item').forEach(item => {
            const name = item.getAttribute('data-name');
            item.style.display = name.includes(query) ? 'flex' : 'none';
        });
    }

    function openAppsCatalogSheet() {
        document.getElementById('appsCatalogOverlay').classList.add('active');
        document.getElementById('adminAppSearch').value = '';
        filterAdminApps();
    }

    function closeAppsCatalogSheet() {
        document.getElementById('appsCatalogOverlay').classList.remove('active');
    }

    function openEditAppModal(key, name) {
        currentEditingKey = key;
        document.getElementById('editModalAppTitle').textContent = name;
        document.getElementById('editAppPasswordInput').value = appPasswordsData[key] || '';
        document.getElementById('editAppOverlay').classList.add('active');
        document.getElementById('editAppPasswordInput').focus();
    }

    function closeEditAppModal() {
        document.getElementById('editAppOverlay').classList.remove('active');
        currentEditingKey = null;
    }

    async function saveAppPasswordFromModal() {
        if (!currentEditingKey) return;
        const newPass = document.getElementById('editAppPasswordInput').value.trim();
        
        // Проверка на чисто цифровой ввод
        if (newPass && !/^\d+$/.test(newPass)) {
            alert('Пароль должен состоять только из цифр!');
            return;
        }

        appPasswordsData[currentEditingKey] = newPass;

        const { error } = await supabaseClient
            .from('settings')
            .upsert({ key: currentEditingKey, value: newPass }, { onConflict: 'key' });

        if (error) {
            alert('Ошибка при сохранении пароля приложения в базу.');
        } else {
            renderAdminAppsList();
            closeEditAppModal();
            // Возвращаем пользователя обратно в каталог приложений, не выкидывая из админки
            openAppsCatalogSheet();
            document.getElementById('catalogButtonText').textContent = 'Каталог приложений (настроено)';
            document.getElementById('catalogButtonText').style.color = '#fff';
        }
    }

    async function saveSettings() {
        const statusMsg = document.getElementById('status-message');
        statusMsg.textContent = 'Сохранение общих настроек...';
        statusMsg.className = '';

        const adminPass = document.getElementById('key-admin_password').value.trim();
        const sitePass = document.getElementById('key-site_password').value.trim();

        let hasError = false;
        const keysToSave = [
            { key: 'admin_password', value: adminPass },
            { key: 'site_password', value: sitePass }
        ];

        for (const item of keysToSave) {
            const { error } = await supabaseClient
                .from('settings')
                .upsert({ key: item.key, value: item.value }, { onConflict: 'key' });
            if (error) hasError = true;
        }

        if (hasError) {
            statusMsg.textContent = 'Ошибка при сохранении общих параметров.';
            statusMsg.className = 'error';
        } else {
            statusMsg.textContent = 'Все изменения успешно сохранены!';
            statusMsg.className = 'success';
        }
    }
</script>

</body>
</html>
