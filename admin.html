<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Установка приложений</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: #1f2937;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* Экран авторизации */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 380px;
            margin: 20px auto;
        }

        #login-screen h1 {
            margin-bottom: 6px;
        }

        .login-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        /* Основная панель */
        #admin-panel {
            display: none;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 24px 0 14px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-save {
            margin-top: 32px;
            width: 100%;
        }

        #status-message, #login-error {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .error { color: var(--danger-color); }
        .success { color: var(--success-color); }
    </style>
</head>
<body>

<div class="container">
    <!-- Секция входа -->
    <div id="login-screen">
        <h1>Вход в систему</h1>
        <p class="subtitle">Введите защитный ключ администратора для доступа к управлению</p>
        <div class="login-box">
            <div class="input-group" style="text-align: left;">
                <label for="admin-pass-input">Пароль</label>
                <input type="password" id="admin-pass-input" placeholder="••••••••••••">
            </div>
            <button onclick="checkAdminAuth()">Войти в панель</button>
        </div>
        <div id="login-error" class="error"></div>
    </div>

    <!-- Основной интерфейс управления -->
    <div id="admin-panel">
        <h1>Управление доступом</h1>
        <p class="subtitle">Настройка общих параметров безопасности и кодов для установки приложений</p>

        <div class="section-title">Системные параметры</div>
        <div class="grid">
            <div class="input-group">
                <label>Пароль администратора</label>
                <input type="text" id="key-admin_password">
            </div>
            <div class="input-group">
                <label>Общий пароль сайта</label>
                <input type="text" id="key-site_password">
            </div>
        </div>

        <div class="section-title">Коды доступа к приложениям</div>
        <div class="grid" id="apps-grid">
            <!-- Сюда динамически подгрудятся приложения -->
        </div>

        <button class="btn-save" onclick="saveSettings()">Сохранить изменения</button>
        <div id="status-message"></div>
    </div>
</div>

<script>
    // НАСТРОЙКИ SUPABASE (замените на свои актуальные данные)
    const SUPABASE_URL = 'https://gbuvpqcummyutycemaaj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_oUDovfvWL6iioG6N5Xd_QQ_8KYezq8g';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const knownKeys = [
        "2gis", "akbars_vseychteno", "avito", "avito_anero", "kuper", 
        "lenta", "lenta_bistroprodykti", "max", "psb_chainay", "rocketbank", 
        "rutube_starship", "rzd", "sberbank", "sberkids_speakaboo", "sbermobail_mobio", 
        "sovkom_scbnotes", "sovkom_sinoptik", "sovkom_vsekarty", "tbank_8pro", 
        "tbank_craftersy", "tbank_drive", "vk", "vk_klips", "vk_video", "yandex_pay"
    ];

    async function checkAdminAuth() {
        const inputPass = document.getElementById('admin-pass-input').value;
        const errorDiv = document.getElementById('login-error');
        errorDiv.textContent = 'Проверка...';
        errorDiv.className = '';

        try {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'admin_password')
                .single();

            if (error || !data) {
                errorDiv.textContent = 'Ошибка подключения к базе данных.';
                errorDiv.className = 'error';
                return;
            }

            if (inputPass === data.value) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadSettings();
            } else {
                errorDiv.textContent = 'Неверный пароль!';
                errorDiv.className = 'error';
            }
        } catch (err) {
            errorDiv.textContent = 'Произошла ошибка авторизации.';
            errorDiv.className = 'error';
            console.error(err);
        }
    }

    async function loadSettings() {
        const appsGrid = document.getElementById('apps-grid');
        appsGrid.innerHTML = '';

        knownKeys.forEach(key => {
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <label>${key}</label>
                <input type="text" id="key-${key}">
            `;
            appsGrid.appsGrid ? appsGrid.appendChild(div) : appsGrid.appendChild(div);
        });

        const { data, error } = await supabaseClient
            .from('settings')
            .select('key, value');

        if (error) {
            console.error('Ошибка загрузки настроек:', error);
            return;
        }

        data.forEach(item => {
            const input = document.getElementById(`key-${item.key}`);
            if (input) {
                input.value = item.value;
            }
        });
    }

    async function saveSettings() {
        const statusMsg = document.getElementById('status-message');
        statusMsg.textContent = 'Сохранение...';
        statusMsg.className = '';

        const allKeysToSave = ['admin_password', 'site_password', ...knownKeys];
        let hasError = false;

        for (const key of allKeysToSave) {
            const input = document.getElementById(`key-${key}`);
            if (input) {
                const value = input.value;
                const { error } = await supabaseClient
                    .from('settings')
                    .upsert({ key: key, value: value }, { onConflict: 'key' });

                if (error) {
                    console.error(`Ошибка при сохранении ${key}:`, error);
                    hasError = true;
                }
            }
        }

        if (hasError) {
            statusMsg.textContent = 'Часть данных не удалось сохранить. Проверьте консоль.';
            statusMsg.className = 'error';
        } else {
            statusMsg.textContent = 'Изменения успешно сохранены!';
            statusMsg.className = 'success';
        }
    }
</script>

</body>
</html>
