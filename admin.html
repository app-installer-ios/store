<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        darkBg: '#07080c',
                        cardBg: '#10131d',
                        cardBorder: '#1c2237',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #07080c;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(16, 19, 29, 0.8) 0%, rgba(10, 12, 18, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-modal {
            background: linear-gradient(135deg, rgba(18, 22, 34, 0.95) 0%, rgba(10, 12, 18, 0.98) 100%);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Уникальные стили для кнопок во всех окнах */
        .btn-primary-cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.25);
            border: 1px solid rgba(6, 182, 212, 0.4);
        }
        .btn-primary-cyan:hover {
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.4);
        }
        .btn-primary-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.25);
            border: 1px solid rgba(139, 92, 246, 0.4);
        }
        .btn-primary-purple:hover {
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
        }
        .btn-primary-emerald {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .btn-primary-emerald:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
        }
        .btn-primary-amber {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .btn-primary-amber:hover {
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Кастомное всплывающее уведомление (Тост) -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 transition-all duration-300 glass-card px-5 py-3 rounded-2xl border border-cyan-500/30 shadow-2xl flex items-center space-x-3">
        <div id="toastIcon" class="w-8 h-8 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center">
            <i data-lucide="check" class="w-4 h-4"></i>
        </div>
        <span id="toastText" class="text-sm font-medium text-white">Успешно выполнено</span>
    </div>

    <!-- Модальное окно (диалоговое окно по центру) -->
    <div id="modalOverlay" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="modalContainer" class="glass-modal w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white/10 transform scale-95 opacity-0 transition-all duration-300">
            <!-- Сюда динамически подгружается контент модалки -->
        </div>
    </div>

    <!-- Основной компактный контейнер -->
    <main class="w-full max-w-xl space-y-4">

        <!-- 1. Главный блок "Пароли" -->
        <div class="glass-card rounded-2xl p-5 border-l-4 border-l-cyan-500 transition-all">
            <div onclick="toggleAccordion('passwordsSection')" class="flex items-center justify-between cursor-pointer select-none">
                <div class="flex items-center space-x-3.5">
                    <div class="w-11 h-11 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                        <i data-lucide="key-round" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-white uppercase tracking-wider">Пароли</h2>
                        <p class="text-xs text-gray-400">Управление доступом, генерация и списки</p>
                    </div>
                </div>
                <i data-lucide="chevron-down" id="passwordsChevron" class="w-5 h-5 text-gray-400 transition-transform duration-300"></i>
            </div>

            <!-- Раскрывающееся подменю паролей -->
            <div id="passwordsSection" class="hidden mt-4 pt-4 border-t border-white/5 space-y-2.5">
                <button onclick="openPasswordEditor('site', 'Сайт')" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-cyan-500/10 border border-white/5 hover:border-cyan-500/30 text-sm font-medium text-gray-200 transition flex items-center justify-between group">
                    <span class="flex items-center space-x-3"><i data-lucide="globe" class="w-4 h-4 text-cyan-400 group-hover:scale-110 transition"></i><span>Сайт</span></span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                </button>
                <button onclick="openPasswordEditor('admin', 'Админ-панель')" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-purple-500/10 border border-white/5 hover:border-purple-500/30 text-sm font-medium text-gray-200 transition flex items-center justify-between group">
                    <span class="flex items-center space-x-3"><i data-lucide="shield-alert" class="w-4 h-4 text-purple-400 group-hover:scale-110 transition"></i><span>Админ-панель</span></span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                </button>
                <button onclick="openAppsList()" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 border border-white/5 hover:border-emerald-500/30 text-sm font-medium text-gray-200 transition flex items-center justify-between group">
                    <span class="flex items-center space-x-3"><i data-lucide="grid" class="w-4 h-4 text-emerald-400 group-hover:scale-110 transition"></i><span>Пароли приложений</span></span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                </button>
            </div>
        </div>

        <!-- 2. Кнопка "Видимость приложений" -->
        <div onclick="openVisibilitySection()" class="glass-card rounded-2xl p-5 border-l-4 border-l-purple-500 cursor-pointer transition-all hover:border-purple-500/50 flex items-center justify-between group">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-xl bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 group-hover:scale-105 transition">
                    <i data-lucide="eye" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">Видимость приложений</h2>
                    <p class="text-xs text-gray-400">Настройка отображения элементов каталога</p>
                </div>
            </div>
            <i data-lucide="arrow-right" class="w-4 h-4 text-gray-500 group-hover:text-purple-400 group-hover:translate-x-1 transition"></i>
        </div>

        <!-- 3. Кнопка "Режим обслуживания" -->
        <div onclick="openMaintenanceSection()" class="glass-card rounded-2xl p-5 border-l-4 border-l-amber-500 cursor-pointer transition-all hover:border-amber-500/50 flex items-center justify-between group">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:scale-105 transition">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">Режим обслуживания</h2>
                    <p class="text-xs text-gray-400">Управление заглушкой и техническими работами</p>
                </div>
            </div>
            <i data-lucide="arrow-right" class="w-4 h-4 text-gray-500 group-hover:text-amber-400 group-hover:translate-x-1 transition"></i>
        </div>

        <!-- 4. Кнопка "История действий" -->
        <div onclick="openHistorySection()" class="glass-card rounded-2xl p-5 border-l-4 border-l-emerald-500 cursor-pointer transition-all hover:border-emerald-500/50 flex items-center justify-between group">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:scale-105 transition">
                    <i data-lucide="history" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">История действий</h2>
                    <p class="text-xs text-gray-400">Аудит и логирование панели управления</p>
                </div>
            </div>
            <i data-lucide="arrow-right" class="w-4 h-4 text-gray-500 group-hover:text-emerald-400 group-hover:translate-x-1 transition"></i>
        </div>

    </main>

    <!-- Скрипты управления логикой и интерфейсом -->
    <script>
        lucide.createIcons();

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = message;
            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 2500);
        }

        function toggleAccordion(id) {
            const section = document.getElementById(id);
            const chevron = document.getElementById('passwordsChevron');
            if (section.classList.contains('hidden')) {
                section.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                section.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function openModal(html) {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            container.innerHTML = html;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
            lucide.createIcons();
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // Окно генерации/копирования/сохранения 6-значного пароля для Сайт / Админ-панель / Приложение
        function openPasswordEditor(idKey, titleName) {
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5">
                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Пароль: ${titleName}</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400">Код доступа (6 цифр)</label>
                        <input type="text" id="passInput_${idKey}" maxlength="6" value="482910" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-center text-lg text-white font-mono tracking-widest focus:outline-none focus:border-cyan-500">
                    </div>
                    <div class="grid grid-cols-3 gap-2 pt-2">
                        <button onclick="generatePass('${idKey}')" class="btn-primary-cyan text-white rounded-xl py-2.5 text-xs font-semibold transition flex items-center justify-center space-x-1">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                            <span>Генерировать</span>
                        </button>
                        <button onclick="copyPass('${idKey}')" class="btn-primary-purple text-white rounded-xl py-2.5 text-xs font-semibold transition flex items-center justify-center space-x-1">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>Копировать</span>
                        </button>
                        <button onclick="savePass('${titleName}')" class="btn-primary-emerald text-white rounded-xl py-2.5 text-xs font-semibold transition flex items-center justify-center space-x-1">
                            <i data-lucide="save" class="w-3.5 h-3.5"></i>
                            <span>Сохранить</span>
                        </button>
                    </div>
                </div>
            `);
        }

        // Модальное окно со списком приложений
        function openAppsList() {
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5">
                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Пароли приложений</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <!-- Кнопка генерации/сохранения для всех приложений сразу -->
                    <button onclick="generateAllAppsPasswords()" class="w-full btn-primary-amber text-white rounded-xl py-3 text-xs font-bold uppercase tracking-wider transition flex items-center justify-center space-x-2">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                        <span>Генерировать и сохранить для всех</span>
                    </button>
                    <div class="space-y-2 pt-1 max-h-60 overflow-y-auto pr-1">
                        <div onclick="openPasswordEditor('sber', 'SberBank')" class="p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 cursor-pointer flex items-center justify-between transition">
                            <span class="text-sm font-medium text-white">SberBank iOS</span>
                            <span class="text-xs text-cyan-400 flex items-center space-x-1"><span>Изменить</span><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
                        </div>
                        <div onclick="openPasswordEditor('tbank', 'T-Bank')" class="p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 cursor-pointer flex items-center justify-between transition">
                            <span class="text-sm font-medium text-white">T-Bank iOS</span>
                            <span class="text-xs text-cyan-400 flex items-center space-x-1"><span>Изменить</span><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
                        </div>
                        <div onclick="openPasswordEditor('max', 'Max App')" class="p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 cursor-pointer flex items-center justify-between transition">
                            <span class="text-sm font-medium text-white">Max App</span>
                            <span class="text-xs text-cyan-400 flex items-center space-x-1"><span>Изменить</span><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
                        </div>
                    </div>
                </div>
            `);
        }

        function openVisibilitySection() {
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5">
                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Видимость приложений</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-sm font-medium text-white">SberBank iOS</span>
                            <input type="checkbox" checked class="w-4 h-4 accent-purple-500 cursor-pointer">
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-sm font-medium text-white">T-Bank iOS</span>
                            <input type="checkbox" checked class="w-4 h-4 accent-purple-500 cursor-pointer">
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-sm font-medium text-white">Max App</span>
                            <input type="checkbox" class="w-4 h-4 accent-purple-500 cursor-pointer">
                        </div>
                    </div>
                </div>
            `);
        }

        function openMaintenanceSection() {
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5">
                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Режим обслуживания</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between">
                        <div>
                            <h4 class="text-xs font-bold text-amber-300 uppercase">Статус: Штатный режим</h4>
                            <p class="text-xs text-gray-400 mt-0.5">Включение заглушки на сайте</p>
                        </div>
                        <button onclick="showToast('Режим обслуживания обновлен!'); closeModal();" class="btn-primary-amber text-white rounded-xl px-4 py-2 text-xs font-semibold transition">
                            Включить
                        </button>
                    </div>
                </div>
            `);
        }

        function openHistorySection() {
            openModal(`
                <div class="space-y-3">
                    <div class="flex items-center justify-between pb-3 border-b border-white/5">
                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">История действий</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex justify-between items-center text-xs">
                        <span class="text-gray-300">Изменен пароль: Сайт</span>
                        <span class="text-gray-500">Только что</span>
                    </div>
                    <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex justify-between items-center text-xs">
                        <span class="text-gray-300">Обновлена видимость приложений</span>
                        <span class="text-gray-500">10 минут назад</span>
                    </div>
                </div>
            `);
        }

        // Генерация строго 6 цифр без букв
        function generatePass(key) {
            const pin = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('passInput_' + key).value = pin;
            showToast("Сгенерирован 6-значный код!");
        }

        function copyPass(key) {
            const input = document.getElementById('passInput_' + key);
            navigator.clipboard.writeText(input.value);
            showToast("Код скопирован в буфер!");
        }

        function savePass(name) {
            showToast(`Пароль для "${name}" сохранен!`);
            closeModal();
        }

        function generateAllAppsPasswords() {
            showToast("Пароли для всех приложений обновлены!");
            closeModal();
        }
    </script>
</body>
</html>
