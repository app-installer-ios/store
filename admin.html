<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Панель управления — Установщик iOS</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b2e 0%, #0d0b14 100%);
      --glass-bg: rgba(25, 22, 38, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-focus: rgba(124, 58, 237, 0.5);
      --accent-color: #7c3aed;
      --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      --text-main: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    /* Основная карточка */
    .admin-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      margin-top: 20px;
    }

    /* Заголовки */
    .title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    /* Секции параметров */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* Поля ввода (исправление мигающей полоски/каретки) */
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: normal;
      caret-color: var(--accent-color);
    }

    .input-field:focus {
      border-color: var(--glass-border-focus);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.2);
    }

    /* Кнопки */
    .btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Элементы каталога приложений */
    .app-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .app-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .app-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .app-name {
      font-size: 15px;
      font-weight: 500;
    }

    /* Кнопка настроек вместо цифр пароля */
    .app-settings-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .app-settings-btn:hover {
      background: rgba(124, 58, 237, 0.25);
      border-color: rgba(124, 58, 237, 0.4);
    }

    /* Минималистичный крестик без кружочка */
    .close-btn {
      background: transparent;
      border: none;
      font-size: 24px;
      color: var(--text-secondary);
      cursor: pointer;
      position: absolute;
      top: 18px;
      right: 20px;
      transition: color 0.2s;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #181526;
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 24px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      animation: modalScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalScale {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* Всплывающая плашка (Тост) уведомлений */
    .notification-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(24, 21, 38, 0.95);
      border: 1px solid rgba(124, 58, 237, 0.5);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      max-width: 90%;
    }

    .notification-toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Уведомление (плашка) -->
  <div id="toast" class="notification-toast">Пароли успешно изменены</div>

  <!-- Главная панель управления -->
  <div class="admin-card">
    <button class="close-btn" onclick="closeCatalog()">×</button>
    <div class="title">Панель управления</div>
    <div class="subtitle">Настройка общих параметров и кодов доступа</div>

    <!-- 1. Пароль администратора -->
    <div class="section-label">1. Пароль администратора</div>
    <div class="input-wrapper">
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="input-field" value="227654" placeholder="Введите пароль">
    </div>

    <!-- 2. Общий пароль сайта -->
    <div class="section-label">2. Общий пароль сайта</div>
    <div class="input-wrapper">
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="input-field" value="930438" placeholder="Введите пароль">
    </div>

    <!-- 3. Пароли приложений -->
    <div class="section-label">3. Пароли приложений</div>
    <div class="app-list-container" id="appList">
       Динамически заполняется через JS 
    </div>
  </div>

  <!-- Модальное окно смены пароля приложения -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-card">
      <div class="title" id="modalAppTitle">Приложение</div>
      <div class="subtitle" style="margin-bottom: 16px;">Новый пароль доступа (только цифры)</div>
      
      <div class="input-wrapper" style="margin-bottom: 0;">
        <input type="text" inputmode="numeric" pattern="[0-9]*" class="input-field" id="modalPasswordInput" placeholder="917483">
      </div>

      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveAppPassword()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // Список приложений с начальными паролями
    let apps = [
      { id: 1, name: "ВКонтакте", pass: "231756" },
      { id: 2, name: "MAX", pass: "754526" },
      { id: 3, name: "VK Видео", pass: "917483" },
      { id: 4, name: "VK Клипы", pass: "332745" },
      { id: 5, name: "СберБанк (Финансы Онлайн)", pass: "602937" },
      { id: 6, name: "Авито", pass: "153418" },
      { id: 7, name: "Совкомбанк", pass: "852358" },
      { id: 8, name: "Т-Банк (8PRO)", pass: "523516" }
    ];

    let currentEditingAppId = null;
    let changedAppsList = [];

    // Рендер списка приложений
    function renderAppList() {
      const container = document.getElementById('appList');
      container.innerHTML = '';
      
      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'app-item';
        item.innerHTML = `
          <span class="app-name">${app.name}</span>
          <button class="app-settings-btn" onclick="openModal(${app.id})" title="Изменить пароль">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        `;
        container.appendChild(item);
      });
    }

    // Открытие модального окна
    function openModal(appId) {
      currentEditingAppId = appId;
      const app = apps.find(a => a.id === appId);
      document.getElementById('modalAppTitle').textContent = app.name;
      document.getElementById('modalPasswordInput').value = app.pass;
      document.getElementById('passwordModal').classList.add('active');
    }

    // Закрытие модального окна
    function closeModal() {
      document.getElementById('passwordModal').classList.remove('active');
      currentEditingAppId = null;
    }

    // Сохранение пароля приложения
    function saveAppPassword() {
      const newPass = document.getElementById('modalPasswordInput').value;
      if (currentEditingAppId !== null) {
        const app = apps.find(a => a.id === currentEditingAppId);
        if (app && app.pass !== newPass) {
          app.pass = newPass;
          if (!changedAppsList.includes(app.name)) {
            changedAppsList.push(app.name);
          }
        }
      }
      closeModal();
      showToast();
    }

    // Показ плашки с уведомлением об измененных приложениях
    function showToast() {
      const toast = document.getElementById('toast');
      if (changedAppsList.length > 0) {
        toast.textContent = `Пароли изменены для: ${changedAppsList.join(', ')}`;
      } else {
        toast.textContent = `Изменения успешно сохранены`;
      }
      
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 4000);
    }

    function closeCatalog() {
      alert('Закрытие окна каталога');
    }

    // Инициализация при загрузке
    renderAppList();
  </script>
</body>
</html>
