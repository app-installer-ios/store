<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог приложений</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .app-card:active {
            transform: scale(0.98);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
        }

        .app-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        .install-btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .install-btn:active {
            opacity: 0.8;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .modal p {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        .modal input {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .modal input:focus {
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: #334155;
            color: var(--text-color);
        }

        .btn-submit {
            background: var(--accent-gradient);
            color: #fff;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Каталог приложений</h1>
            <p>Выберите приложение для установки</p>
        </header>

        <!-- Карточка приложения Лента -->
        <div class="app-card" onclick="openPasswordModal('lenta', 'itms-services://?action=download-manifest&url=https://your-username.github.io/your-repo/lenta.plist')">
            <div class="app-icon">Л</div>
            <div class="app-info">
                <div class="app-title">Лента</div>
                <div class="app-desc">Официальное клиентское приложение</div>
            </div>
            <button class="install-btn">Установить</button>
        </div>
    </div>

    <!-- Модальное окно ввода пароля -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <h3>Требуется пароль</h3>
            <p>Введите пароль для доступа к загрузке приложения</p>
            <input type="password" id="passwordInput" placeholder="Введите пароль">
            <div class="error-msg" id="errorMsg">Неверный пароль</div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closePasswordModal()">Отмена</button>
                <button class="btn-submit" onclick="verifyPassword()">Продолжить</button>
            </div>
        </div>
    </div>

    <script>
        let currentAppUrl = '';
        let currentAppKey = '';
        
        // Хэш пароля для приложения Лента (lentLo11 в Base64)
        const appPasswords = {
            'lenta': 'bGVudExvMTE='
        };

        function openPasswordModal(appKey, appUrl) {
            currentAppKey = appKey;
            currentAppUrl = appUrl;
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('passwordModal').classList.add('active');
            
            setTimeout(() => {
                const input = document.getElementById('passwordInput');
                input.focus();
                // Корректировка прокрутки при появлении клавиатуры на мобильных устройствах
                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        function verifyPassword() {
            const inputVal = document.getElementById('passwordInput').value;
            // Простейшая проверка через Base64
            const encodedVal = btoa(inputVal);
            
            if (encodedVal === appPasswords[currentAppKey]) {
                closePasswordModal();
                window.location.href = currentAppUrl;
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // Автоматическая корректировка viewport при изменении высоты (вызов клавиатуры)
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const modal = document.querySelector('.modal');
                if (modal && document.activeElement.tagName === 'INPUT') {
                    document.activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }
    </script>
</body>
</html>
