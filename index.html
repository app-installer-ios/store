<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка приложений</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }
        /* Статусы и ошибки */
        .status-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-top: 40px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Список приложений */
        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .app-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }
        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
            background-color: var(--border);
            flex-shrink: 0;
        }
        .app-details {
            overflow: hidden;
        }
        .app-name {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-version {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }
        .install-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .install-btn:hover {
            background-color: var(--accent-hover);
            color: white;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Доступные приложения</h1>
        <p class="subtitle">Установка выбранных приложений для вашего устройства</p>
    </header>

    <!-- Состояние загрузки -->
    <div id="loading-state" class="status-card">
        <div class="spinner"></div>
        <p style="margin: 0; color: var(--text-secondary);">Проверяем доступ...</p>
    </div>

    <!-- Состояние ошибки или недействительной ссылки -->
    <div id="error-state" class="status-card hidden">
        <h3 style="margin-top: 0; color: #ef4444;">Ссылка недействительна</h3>
        <p id="error-text" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 0;">Возможно, срок действия ссылки истек или она указана неверно.</p>
    </div>

    <!-- Контейнер со списком приложений -->
    <div id="apps-container" class="apps-list hidden">
        <!-- Сюда динамически добавятся приложения -->
    </div>
</div>

<script>
    // НАСТРОЙКИ SUPABASE (замените на свои ключи)
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'ВАШ_SUPABASE_ANON_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Главная функция инициализации
    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        // Поддерживаем разные варианты параметров в ссылке (?token=... или ?invite=...)
        const token = urlParams.get('token') || urlParams.get('invite');

        if (!token) {
            showError("В ссылке отсутствует токен доступа. Запросите новую ссылку у бота.");
            return;
        }

        try {
            // 1. Ищем токен в таблице сапбазы (предполагаем, что таблица называется invite_links)
            // Поля в таблице: token (текст), apps (массив строк или JSON с ID/названиями приложений)
            const { data, error } = await supabaseClient
                .from('invite_links')
                .select('*')
                .eq('token', token)
                .single();

            if (error || !data) {
                showError("Такой ссылки не существует или она была удалена.");
                return;
            }

            // Проверяем, передан ли список приложений (например, массив данных data.apps)
            let allowedAppIds = data.apps; 
            if (typeof allowedAppIds === 'string') {
                try { allowedAppIds = JSON.parse(allowedAppIds); } catch(e){}
            }

            if (!Array.isArray(allowedAppIds) || allowedAppIds.length === 0) {
                showError("К этой ссылке не привязано ни одного приложения.");
                return;
            }

            // 2. Загружаем детальную информацию по разрешенным приложениям 
            // (Предполагаем, что у вас есть таблица со списком приложений "apps_catalog", где есть id, name, version, icon_url, plist_url)
            const { data: appsData, error: appsError } = await supabaseClient
                .from('apps_catalog')
                .select('*')
                .in('id', allowedAppIds); // выбираем только те, ID которых разрешены в инвайте

            if (appsError || !appsData || appsData.length === 0) {
                showError("Не удалось загрузить каталог приложений для вашей ссылки.");
                return;
            }

            renderApps(appsData);

        } catch (err) {
            console.error(err);
            showError("Произошла ошибка при загрузке данных.");
        }
    }

    // Рендер списка приложений
    function renderApps(apps) {
        const container = document.getElementById('apps-container');
        container.innerHTML = '';

        apps.forEach(app => {
            const item = document.createElement('div');
            item.className = 'app-item';

            // Формируем ссылку на установку через itms-services
            // Обычно она выглядит так: itms-services://?action=download-manifest&url=ССЫЛКА_НА_PLIST
            const installLink = `itms-services://?action=download-manifest&url=${encodeURIComponent(app.plist_url)}`;

            item.innerHTML = `
                <div class="app-info">
                    <img src="${app.icon_url || 'https://via.placeholder.com/56'}" alt="${app.name}" class="app-icon">
                    <div class="app-details">
                        <h3 class="app-name">${app.name}</h3>
                        <p class="app-version">Версия: ${app.version || '1.0'}</p>
                    </div>
                </div>
                <a href="${installLink}" class="install-btn">Установить</a>
            `;
            container.appendChild(item);
        });

        document.getElementById('loading-state').classList.add('hidden');
        container.classList.remove('hidden');
    }

    function showError(message) {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-text').textContent = message;
        document.getElementById('error-state').classList.remove('hidden');
    }

    // Запуск при загрузке страницы
    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
