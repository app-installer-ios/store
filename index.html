<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка приложения</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus {
            border-color: #007aff;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #007aff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:active {
            background-color: #0056b3;
        }
        .error {
            color: #ff3b30;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        #mainApp {
            display: none;
        }
    </style>
    <!-- Подключаем клиент Supabase v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Блок авторизации / ввода кода -->
    <div class="card" id="authApp">
        <h2>Введите инвайт-код</h2>
        <input type="text" id="passInput" placeholder="Код доступа" autocomplete="off">
        <button onclick="submitPassword()">Войти</button>
        <div id="authError" class="error">Неверный или уже использованный код</div>
    </div>

    <!-- Основной контент сайта (скрыт до ввода кода) -->
    <div class="card" id="mainApp">
        <h2>Приложение доступно</h2>
        <p>Добро пожаловать! Вы успешно прошли проверку.</p>
        <!-- Сюда можно добавить вашу кнопку скачивания/установки .plist -->
        <a href="itms-services://?action=download-manifest&url=УКРЫТИЙ_ПУТЬ_К_MANIFEST.plist">
            <button style="background-color: #34c759;">Установить приложение</button>
        </a>
    </div>

    <script>
        // Ваши реальные данные из Supabase
        const SUPABASE_URL = 'https://relgchzdcxdzojezgtuw.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_CdIRVNe6IXmneUHL83PIOA_QO9YSwpO';
        
        // Инициализация Supabase
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Проверка: если пользователь уже авторизовался в этой сессии, сразу показываем приложение
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("site_access") === "true") {
                document.getElementById("authApp").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
            }
        });

        async function submitPassword() {
            const input = document.getElementById("passInput");
            const errorMsg = document.getElementById("authError");
            const appContainer = document.getElementById("mainApp");
            const authContainer = document.getElementById("authApp");
            const enteredCode = input.value.trim();

            if (!enteredCode) return;

            try {
                // 1. Ищем код в базе данных, который еще не использован
                const { data: codeRow, error } = await _supabase
                    .from('invite_codes')
                    .select('*')
                    .eq('code', enteredCode)
                    .eq('is_used', false)
                    .single();

                // Если код не найден или уже использован
                if (error || !codeRow) {
                    errorMsg.style.display = "block";
                    input.value = "";
                    input.focus();
                    return;
                }

                // 2. Сразу же помечаем код как использованный (is_used = true)
                const { error: updateError } = await _supabase
                    .from('invite_codes')
                    .update({ is_used: true })
                    .eq('id', codeRow.id);

                if (updateError) {
                    alert("Ошибка активации кода. Попробуйте снова.");
                    return;
                }

                // 3. Успешный вход
                sessionStorage.setItem("site_access", "true");
                authContainer.style.display = "none";
                appContainer.style.display = "block";

            } catch (e) {
                console.error(e);
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
