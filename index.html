<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS App Catalog</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #0a84ff;
            --border-color: #38383a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 16px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: left;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sheet-item {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sheet-item:active {
            opacity: 0.7;
        }

        .sheet-info-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-size: 17px;
            font-weight: 600;
        }

        .download-counter {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .divider-hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 4px 0;
            display: none; /* скрыто, если используются блочные карточки */
        }

        /* Модальное окно для ввода пароля */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: #2c2c2e;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background-color: #1c1c1e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn.cancel {
            background-color: #3a3a3c;
            color: var(--text-color);
        }

        .modal-btn.submit {
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Каталог приложений</h1>
        
        <input type="text" id="searchBox" class="search-box" placeholder="Поиск приложений..." oninput="filterApps()">

        <div class="apps-list" id="appsList">
            
            <div class="sheet-item" data-key="lenta" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://app-installer-ios.github.io/store/lenta.plist', 'lenta')">
                <div class="sheet-info-box">
                    <span class="app-name">Лента</span>
                    <span class="download-counter" id="counter-lenta">Скачиваний: 0</span>
                </div>
            </div>

            <div class="sheet-item" data-key="psb" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://app-installer-ios.github.io/store/psb.plist', 'psb')">
                <div class="sheet-info-box">
                    <span class="app-name">ПСБ Чайная церемония</span>
                    <span class="download-counter" id="counter-psb">Скачиваний: 0</span>
                </div>
            </div>

            <div class="sheet-item" data-key="kuper" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://app-installer-ios.github.io/store/kuper.plist', 'kuper')">
                <div class="sheet-info-box">
                    <span class="app-name">Купер</span>
                    <span class="download-counter" id="counter-kuper">Скачиваний: 0</span>
                </div>
            </div>

            <div class="sheet-item" data-key="rzd" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://app-installer-ios.github.io/store/rzd.plist', 'rzd')">
                <div class="sheet-info-box">
                    <span class="app-name">РЖД Пассажирам</span>
                    <span class="download-counter" id="counter-rzd">Скачиваний: 0</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Модальное окно ввода пароля -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-card">
            <div class="modal-title">Требуется пароль</div>
            <div class="modal-subtitle" id="modalAppName">Введите пароль для доступа</div>
            <input type="password" id="passwordInput" class="modal-input" placeholder="Пароль" inputmode="text">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                <button class="modal-btn submit" onclick="verifyPassword()">OK</button>
            </div>
        </div>
    </div>

    <script>
        // База данных паролей в Base64
        const passwords = {
            "lenta": "bGVudExvMTE=",
            "psb": "c3BzdDIwMjY=", // пример или ваш реальный хеш для псб
            "kuper": "a3VwZXIyMDI2", // пример
            "rzd": "cnpkMjAyNg=="
        };

        let currentUrl = "";
        let currentKey = "";

        // Инициализация счетчиков из localStorage
        document.addEventListener("DOMContentLoaded", () => {
            ['lenta', 'psb', 'kuper', 'rzd'].forEach(key => {
                let count = localStorage.getItem('counter_' + key) || 0;
                let counterEl = document.getElementById('counter-' + key);
                if (counterEl) {
                    counterEl.innerText = "Скачиваний: " + count;
                }
            });

            // Обработка фокуса для защиты от закрытия клавиатурой (visualViewport)
            const passwordInput = document.getElementById('passwordInput');
            passwordInput.addEventListener('focus', () => {
                setTimeout(() => {
                    passwordInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });
        });

        function selectApp(element, url, key) {
            currentUrl = url;
            currentKey = key;
            const appName = element.querySelector('.app-name').innerText;
            
            document.getElementById('modalAppName').innerText = "Приложение: " + appName;
            document.getElementById('passwordInput').value = "";
            document.getElementById('passwordModal').classList.add('active');
            
            setTimeout(() => {
                document.getElementById('passwordInput').focus();
            }, 100);
        }

        function closeModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        function verifyPassword() {
            const inputVal = document.getElementById('passwordInput').value;
            const encodedInput = btoa(unescape(encodeURIComponent(inputVal)));
            
            if (passwords[currentKey] && encodedInput === passwords[currentKey]) {
                closeModal();
                
                // Увеличение счетчика
                let count = parseInt(localStorage.getItem('counter_' + currentKey) || 0) + 1;
                localStorage.setItem('counter_' + currentKey, count);
                let counterEl = document.getElementById('counter-' + currentKey);
                if (counterEl) {
                    counterEl.innerText = "Скачиваний: " + count;
                }

                // Запуск установки
                window.location.href = currentUrl;
            } else {
                alert("Неверный пароль!");
                document.getElementById('passwordInput').value = "";
            }
        }

        function filterApps() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const items = document.querySelectorAll('.sheet-item');

            items.forEach(item => {
                const name = item.querySelector('.app-name').innerText.toLowerCase();
                if (name.includes(query)) {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
