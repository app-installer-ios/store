<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка приложений</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }
        .status-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .app-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            background-color: var(--border);
            flex-shrink: 0;
        }
        .app-details {
            overflow: hidden;
            text-align: left;
        }
        .app-name {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-version {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }
        .install-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .install-btn:hover {
            background-color: var(--accent-hover);
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .error-title {
            margin-top: 0;
            color: var(--error-color);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Состояние загрузки -->
    <div id="loading-state" class="status-card">
        <div class="spinner"></div>
        <p style="margin: 0; color: var(--text-secondary);">Подготавливаем ваши приложения...</p>
    </div>

    <!-- Состояние ошибки -->
    <div id="error-state" class="status-card hidden">
        <h3 id="error-title" class="error-title">Ссылка недействительна</h3>
        <p id="error-text" class="error-desc">Пожалуйста, сгенерируйте новую ссылку в боте.</p>
    </div>

    <!-- Контейнер со списком приложений -->
    <div id="apps-content" class="hidden">
        <header>
            <h1>Ваши приложения</h1>
            <p class="subtitle">Выберите приложение для установки на устройство</p>
        </header>
        <div id="apps-container" class="apps-list"></div>
    </div>
</div>

<script>
    // Вставьте ваши данные из Supabase (используйте anon key)
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'ВАШ_SUPABASE_ANON_KEY';

    let supabaseClient;
    try {
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch (e) {
        console.error(e);
    }

    async function init() {
        if (!supabaseClient) {
            showError("Сервис временно недоступен", "Настройки подключения указаны неверно. Пожалуйста, обратитесь в поддержку.");
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || urlParams.get('invite');

        if (!token) {
            showError("Недействительная ссылка", "В ссылке отсутствует токен доступа. Пожалуйста, запросите новую персональную ссылку у бота.");
            return;
        }

        token = token.trim();

        try {
            // Ищем токен в таблице invite_links
            const { data, error } = await supabaseClient
                .from('invite_links')
                .select('*')
                .ilike('token', token)
                .maybeSingle();

            if (error) {
                console.error("Ошибка при поиске токена:", error);
                showError("Ошибка доступа", "Не удалось проверить ссылку. Попробуйте получить новую ссылку в боте.");
                return;
            }

            if (!data) {
                showError("Ссылка не найдена", "Срок действия этой ссылки истек или она не существует. Запросите свежую ссылку у бота.");
                return;
            }

            // Проверка на статус "уже использована"
            if (data.used === true || data.is_used === true) {
                showError("Ссылка уже использована", "Эта персональная ссылка была активирована ранее. Пожалуйста, сгенерируйте новую ссылку в боте.");
                return;
            }

            let appsList = data.apps;
            if (typeof appsList === 'string') {
                try { appsList = JSON.parse(appsList); } catch(e){}
            }

            if (!Array.isArray(appsList) || appsList.length === 0) {
                showError("Нет доступных приложений", "К вашей ссылке не было привязано ни одного приложения. Выберите приложения в боте и создайте новую ссылку.");
                return;
            }

            // Если список содержит просто ID или названия приложений (строки)
            if (typeof appsList[0] === 'string') {
                const { data: appsData, error: appsError } = await supabaseClient
                    .from('apps_catalog')
                    .select('*')
                    .in('id', appsList);

                if (!appsError && appsData && appsData.length > 0) {
                    renderApps(appsData);
                    return;
                }
            } else if (typeof appsList[0] === 'object') {
                // Если бот записал готовые объекты приложений прямо в массив
                renderApps(appsList);
                return;
            }

            showError("Приложения не найдены", "Не удалось загрузить данные выбранных приложений. Попробуйте повторить запрос в боте.");

        } catch (err) {
            console.error(err);
            showError("Произошла ошибка", "Что-то пошло не так. Попробуйте открыть ссылку повторно через несколько минут.");
        }
    }

    function renderApps(apps) {
        const container = document.getElementById('apps-container');
        container.innerHTML = '';

        apps.forEach(app => {
            const item = document.createElement('div');
            item.className = 'app-item';

            // Если plist_url относительный или полный
            const plistUrl = app.plist_url || (app.plist ? app.plist : '');
            const installLink = `itms-services://?action=download-manifest&url=${encodeURIComponent(plistUrl)}`;

            item.innerHTML = `
                <div class="app-info">
                    <img src="${app.icon_url || app.icon || 'https://via.placeholder.com/52'}" alt="${app.name}" class="app-icon">
                    <div class="app-details">
                        <h3 class="app-name">${app.name || 'Приложение'}</h3>
                        <p class="app-version">Версия: ${app.version || '1.0'}</p>
                    </div>
                </div>
                <a href="${installLink}" class="install-btn">Установить</a>
            `;
            container.appendChild(item);
        });

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('apps-content').classList.remove('hidden');
    }

    function showError(title, message) {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-title').textContent = title;
        document.getElementById('error-text').textContent = message;
        document.getElementById('error-state').classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
