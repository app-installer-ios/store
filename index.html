<!DOCTYPE>
<html lang="ru">
<head
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Установка удалённых приложений</title>

    <style>
        body { 
            background-color: #0b0e14; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;    
            box-sizing: border-box;
        }
        .container { width: 100%; max-width: 400px; }
        
        h1 { 
            font-size: 22px; 
            margin-bottom: 8px; 
            text-align: center; 
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { 
            font-size: 13px; 
            text-align: center; 
            margin-bottom: 20px; 
            font-weight: 600; 
            color: #94a3b8;
            letter-spacing: 0.2px;
            line-height: 1.4;
        }
        
        .warning-box { 
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.12), rgba(168, 85, 247, 0.12)); 
            border: 1px solid rgba(239, 68, 68, 0.4); 
            color: #ff8080; 
            border-radius: 14px; 
            padding: 14px 16px; 
            font-size: 13px; 
            line-height: 1.5; 
            margin-bottom: 20px; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
            text-align: center;
            font-weight: 600;
        }
        
        .text-warning { color: #fbbf24; font-weight: bold; }
        .text-danger { color: #f87171; font-weight: bold; }
        .text-highlight { color: #38bdf8; font-weight: 600; }

        .card { 
            background: #161b26; 
            border-radius: 16px; 
            padding: 20px; 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        label { font-size: 14px; font-weight: 600; color: #f1f5f9; text-align: left; }

        .custom-select-btn {
            background: #0b0e14; 
            color: #38bdf8; 
            border: 2px solid #6366f1; 
            padding: 14px 12px; 
            border-radius: 10px; 
            font-size: 15px; 
            width: 100%; 
            outline: none; 
            font-weight: 600;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .custom-select-btn::after {
            content: "▼";
            font-size: 11px;
            color: #6366f1;
        }

        .btn { 
            background: linear-gradient(135deg, #a855f7, #6366f1); 
            color: #ffffff; 
            border: none;
            font-weight: 700; 
            font-size: 16px; 
            padding: 14px; 
            border-radius: 10px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); 
            display: block; 
            width: 100%;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn:active { transform: scale(0.97); opacity: 0.9; }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            box-shadow: none;
            margin-top: 6px;
        }

        .toast {
            display: none;
            opacity: 0;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #34d399;
            color: #6ee7b7;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
            transition: opacity 0.4s ease;
        }
        .toast.show {
            display: block;
            opacity: 1;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e1e1e1;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ffcc00;
            box-shadow: 0 0 8px #ffcc00;
            transition: all 0.3s ease;
        }

        .status-badge.online .status-dot {
            background-color: #34c759;
            box-shadow: 0 0 8px #34c759;
        }

        .status-badge.offline .status-dot {
            background-color: #ff3b30;
            box-shadow: 0 0 8px #ff3b30;
        }

        .auth-box {
            background: #161b26;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 2px solid transparent;
            background-image: linear-gradient(#161b26, #161b26), linear-gradient(135deg, #a855f7, #6366f1);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-input {
            background: #0b0e14;
            color: #ffffff;
            border: 2px solid #6366f1;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            outline: none;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
            box-sizing: border-box;
            width: 100%;
        }

        .auth-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
        }

        .auth-error {
            color: #f87171;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 480px) {
            .sheet-overlay {
                align-items: center;
            }
        }

        .sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sheet-modal {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: #161b26;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px 16px 24px 16px;
            z-index: 1000;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @media (min-width: 480px) {
            .sheet-modal {
                border-radius: 20px;
                transform: scale(0.95);
                transition: all 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            }
        }

        .sheet-overlay.active .sheet-modal {
            transform: translateY(0);
        }

        @media (min-width: 480px) {
            .sheet-overlay.active .sheet-modal {
                transform: scale(1);
            }
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .sheet-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .sheet-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sheet-item {
            padding: 10px 12px;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sheet-item:active, .sheet-item.selected {
            background: rgba(99, 102, 241, 0.2);
            color: #a855f7;
        }

        .app-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            background: #ffffff;
            object-fit: fill;
        }
    </style>
</head>
