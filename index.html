<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка приложений</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }
        .status-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-top: 40px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .app-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }
        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
            background-color: var(--border);
            flex-shrink: 0;
        }
        .app-details {
            overflow: hidden;
        }
        .app-name {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-version {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }
        .install-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .install-btn:hover {
            background-color: var(--accent-hover);
            color: white;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Доступные приложения</h1>
        <p class="subtitle">Установка выбранных приложений</p>
    </header>

    <div id="loading-state" class="status-card">
        <div class="spinner"></div>
        <p style="margin: 0; color: var(--text-secondary);">Проверяем доступ...</p>
    </div>

    <div id="error-state" class="status-card hidden">
        <h3 style="margin-top: 0; color: #ef4444;">Ошибка доступа</h3>
        <p id="error-text" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 0; word-break: break-all;"></p>
    </div>

    <div id="apps-container" class="apps-list hidden"></div>
</div>

<script>
    // Вставьте ваши реальные данные от Supabase
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'ВАШ_SUPABASE_ANON_KEY';

    let supabaseClient;
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
        showError("Ошибка инициализации Supabase: проверьте правильность ключей.");
    }

    async function init() {
        if (!supabaseClient) return;

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || urlParams.get('invite');

        if (!token) {
            showError("В ссылке отсутствует токен. Откройте корректную ссылку, полученную от бота.");
            return;
        }

        try {
            // Ищем токен в таблице invite_links
            const { data, error } = await supabaseClient
                .from('invite_links')
                .select('*')
                .eq('token', token)
                .maybeSingle(); // Использование maybeSingle вместо single защищает от падения, если строка не найдена

            if (error) {
                showError("Ошибка базы данных: " + error.message);
                return;
            }

            if (!data) {
                showError("Указанный токен не найден в базе данных или устарел.");
                return;
            }

            let allowedAppIds = data.apps; 
            if (typeof allowedAppIds === 'string') {
                try { allowedAppIds = JSON.parse(allowedAppIds); } catch(e){}
            }

            if (!Array.isArray(allowedAppIds) || allowedAppIds.length === 0) {
                showError("К этой ссылке не привязано ни одного приложения.");
                return;
            }

            // Загружаем приложения из каталога
            const { data: appsData, error: appsError } = await supabaseClient
                .from('apps_catalog')
                .select('*')
                .in('id', allowedAppIds);

            if (appsError) {
                showError("Ошибка загрузки каталога: " + appsError.message);
                return;
            }

            if (!appsData || appsData.length === 0) {
                showError("Приложения, указанные в ссылке, не найдены в каталоге.");
                return;
            }

            renderApps(appsData);

        } catch (err) {
            console.error(err);
            showError("Непредвиденная ошибка: " + err.message);
        }
    }

    function renderApps(apps) {
        const container = document.getElementById('apps-container');
        container.innerHTML = '';

        apps.forEach(app => {
            const item = document.createElement('div');
            item.className = 'app-item';

            const installLink = `itms-services://?action=download-manifest&url=${encodeURIComponent(app.plist_url)}`;

            item.innerHTML = `
                <div class="app-info">
                    <img src="${app.icon_url || 'https://via.placeholder.com/56'}" alt="${app.name}" class="app-icon">
                    <div class="app-details">
                        <h3 class="app-name">${app.name}</h3>
                        <p class="app-version">Версия: ${app.version || '1.0'}</p>
                    </div>
                </div>
                <a href="${installLink}" class="install-btn">Установить</a>
            `;
            container.appendChild(item);
        });

        document.getElementById('loading-state').classList.add('hidden');
        container.classList.remove('hidden');
    }

    function showError(message) {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-text').textContent = message;
        document.getElementById('error-state').classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
