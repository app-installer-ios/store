<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка iOS приложений</title>
    <style>
        /* Базовые стили страницы */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-container {
            text-align: center;
        }

        /* Стили модального окна / виджета */
        .widget-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }

        .widget-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .widget-content h3 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .widget-content p {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 20px;
        }

        .widget-close-btn {
            width: 100%;
            padding: 12px;
            background: #0071e3;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .widget-close-btn:hover {
            background: #0077ed;
        }

        /* Класс для скрытия виджета */
        .widget-hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Главная страница</h1>
        <p>Добро пожаловать на сервис установки приложений.</p>
        <button onclick="showWidget()" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer;">Открыть виджет заново</button>
    </div>

    <!-- Виджет -->
    <div id="appWidget" class="widget-overlay">
        <div class="widget-content">
            <h3>Установка приложений</h3>
            <p>Выберите нужное приложение для установки на ваше устройство iOS.</p>
            <!-- Сдесь можно разместить ваши ссылки или списки -->
            
            <!-- Кнопка закрытия внизу -->
            <button id="closeWidgetBtn" class="widget-close-btn">Закрыть</button>
        </div>
    </div>

    <script>
        // Функция для показа виджета (если понадобится вызвать вручную)
        function showWidget() {
            const widget = document.getElementById("appWidget");
            widget.classList.remove("widget-hidden");
        }

        document.addEventListener("DOMContentLoaded", function() {
            const widget = document.getElementById("appWidget");
            const closeBtn = document.getElementById("closeWidgetBtn");

            // 1. Виджет появляется при каждой перезагрузке страницы.
            // Если хотите, чтобы он скрывался до конца сессии вкладки, раскомментируйте блок ниже:
            /*
            if (sessionStorage.getItem("widgetClosed") === "true") {
                widget.classList.add("widget-hidden");
            }
            */

            // 2. Обработчик клика по кнопке закрытия внизу
            closeBtn.addEventListener("click", function() {
                widget.classList.add("widget-hidden");
                
                // Раскомментируйте следующую строку, если нужно запоминать закрытие до закрытия вкладки браузера:
                // sessionStorage.setItem("widgetClosed", "true");
            });
        });
    </script>
</body>
</html>
