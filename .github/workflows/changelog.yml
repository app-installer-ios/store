name: Update Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Changelog JSON
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            
            const logs = execSync("git log -n 10 --pretty=format:\"%h|%s|%ad\" --date=short").toString().trim().split("\n");
            const changes = logs.map(line => {
              const [hash, message, date] = line.split("|");
              return { hash, message, date };
            });

            fs.writeFileSync("changelog.json", JSON.stringify(changes, null, 2));
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add changelog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update changelog.json" && git push)
